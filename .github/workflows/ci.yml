      - name: "T4: AI composer dictation (qa-ai-dictation)"
        id: qa-ai-dictation
        run: node tools/qa-ai-dictation.cjs

      # D-1 (UI-CI-DIRECTIVE section 5.4): the assistant must fit any width.
      # Sheet at 360/420/480, docked at 480/520/658/900, Maximise at 1900,
      # light and dark: no overflow, a 56px one-row header, a composer card
