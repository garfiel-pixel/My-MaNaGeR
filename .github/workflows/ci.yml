      - name: "T4: AI window fits any width (qa-ai-window-layout)"
        id: qa-ai-window-layout
        run: node tools/qa-ai-window-layout.cjs

      - name: "T4: v11 feature battery (qa-v11)"
        id: qa-v11
        run: node qa-v11.cjs

      - name: "T4: P1 core battery (qa-p1)"
        id: qa-p1
        run: node qa-p1.cjs

      - name: "T4: Theme persistence + system follow (verify-theme-cdp)"
        id: qa-theme
        run: node tools/verify-theme-cdp.cjs

      # Playwright-based calculator batteries (owner 2026-10-01: every trade
      # covered the same way). playwright is a devDependency; installed here
      # because the batteries use the system Chrome via chrome-launcher, so
      # no browser download is needed.

      - name: "T4: Dialog controls actually change (qa-modals)"
        id: qa-modals
        run: node tools/qa-modals.cjs

      # GOLD-1 (REFINEMENT-DIRECTIVE-2026-10-24 section 5): the gold gate.
      # Static arms prove no old orange survives outside the documented
      # allow-list, that the allow-list has no stale entries, and that the app
      # and marketing stylesheets carry identical gold tokens. The browser arms
