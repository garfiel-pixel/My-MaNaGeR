      - name: "T4: Hero globe battery (qa-hero-globe)"
        id: qa-hero-globe
        run: node tools/qa-hero-globe.cjs

      - name: "T4: Stop static QA server"
        if: always()
        run: pkill -f "node serve.cjs" || true

      # ── CI Summary ──────────────────────────────────────────────────

      - name: Job summary (browser-app)
        if: always()
        run: |
          echo "### browser-app: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [static, cloud-core, cloud-auth, browser-calc, browser-app]
    if: always()
    steps:
      - name: CI Summary
        run: |
          {
            echo "## CI result"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| static | ${{ needs['static'].result }} |"
            echo "| cloud-core | ${{ needs['cloud-core'].result }} |"
            echo "| cloud-auth | ${{ needs['cloud-auth'].result }} |"
            echo "| browser-calc | ${{ needs['browser-calc'].result }} |"
            echo "| browser-app | ${{ needs['browser-app'].result }} |"
            echo ""
            echo "Each job page lists its own steps."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
