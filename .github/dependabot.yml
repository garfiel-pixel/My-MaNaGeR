version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers: []
    # Wave 8.8 (2026-10-06): minor and patch bumps are now proposed too.
    # Ignoring both left the dependency tree stale. Only major bumps stay
    # ignored so a breaking upgrade never lands as an auto-PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # SEC-07: roll every npm bump into one PR to cut notification noise.
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    # SEC-07: roll every action bump into one PR.
    groups:
      github-actions:
        patterns:
          - "*"
