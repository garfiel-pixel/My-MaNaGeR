<svg xmlns="http://www.w3.org/2000/svg" width="900" height="491" viewBox="0 0 900 491" role="img" aria-label="Earned value budget chart: planned spending glides down, actual spending tracks below it">
  <defs>
    <radialGradient id="evmBoard" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#25211D"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </radialGradient>
  </defs>

  <!-- navy board -->
  <rect width="900" height="491" fill="url(#evmBoard)"/>

  <!-- faint blueprint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="45" y1="0"  x2="45" y2="491"/><line x1="130" y1="0" x2="130" y2="491"/>
    <line x1="215" y1="0" x2="215" y2="491"/><line x1="300" y1="0" x2="300" y2="491"/>
    <line x1="385" y1="0" x2="385" y2="491"/><line x1="470" y1="0" x2="470" y2="491"/>
    <line x1="555" y1="0" x2="555" y2="491"/><line x1="640" y1="0" x2="640" y2="491"/>
    <line x1="725" y1="0" x2="725" y2="491"/><line x1="810" y1="0" x2="810" y2="491"/>
    <line x1="0" y1="45" x2="900" y2="45"/><line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="215" x2="900" y2="215"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="385" x2="900" y2="385"/><line x1="0" y1="450" x2="900" y2="450"/>
  </g>

  <!-- chart frame -->
  <g stroke="#E0DAD2" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="70" y1="60" x2="70" y2="380"/>
    <line x1="70" y1="380" x2="840" y2="380"/>
  </g>
  <!-- horizontal guide lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="70" y1="120" x2="840" y2="120"/>
    <line x1="70" y1="190" x2="840" y2="190"/>
    <line x1="70" y1="260" x2="840" y2="260"/>
    <line x1="70" y1="330" x2="840" y2="330"/>
  </g>

  <!-- planned value: gold, glides down -->
  <polyline points="70,120 240,150 410,190 580,240 840,330"
    fill="none" stroke="#E8923A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- earned/actual: cream, tracks under planned -->
  <polyline points="70,122 240,146 410,178 580,215 840,268"
    fill="none" stroke="#F5EFE6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 0"/>

  <!-- today marker -->
  <line x1="580" y1="60" x2="580" y2="380" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5 7" opacity="0.85"/>
  <circle cx="580" cy="240" r="10" fill="#FFFFFF" stroke="#D96B27" stroke-width="3.5"/>
  <circle cx="580" cy="215" r="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/>

  <!-- variance callout -->
  <line x1="580" y1="240" x2="680" y2="150" stroke="#F5EFE6" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="628" y="96" width="164" height="46" rx="9" fill="#FFFFFF" stroke="#D96B27" stroke-width="2.5"/>
  <text x="710" y="116" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#57534E">CPI 1.04</text>
  <text x="710" y="134" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#A8A29E">under budget</text>

  <!-- legend -->
  <g font-family="Inter,system-ui,sans-serif" font-size="14" fill="#D8CFC2">
    <line x1="88" y1="426" x2="122" y2="426" stroke="#E8923A" stroke-width="7" stroke-linecap="round"/>
    <text x="132" y="431">Planned spend</text>
    <line x1="290" y1="426" x2="324" y2="426" stroke="#F5EFE6" stroke-width="5" stroke-linecap="round"/>
    <text x="334" y="431">Actual spend</text>
    <line x1="508" y1="426" x2="542" y2="426" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="552" y="431">Today</text>
  </g>

  <!-- month ticks -->
  <g font-family="Inter,system-ui,sans-serif" font-size="12" fill="#A8A29E" text-anchor="middle">
    <text x="70" y="404">W1</text>
    <text x="240" y="404">W4</text>
    <text x="410" y="404">W8</text>
    <text x="580" y="404">W12</text>
    <text x="840" y="404">W16</text>
  </g>

  <!-- caption -->
  <text x="450" y="468" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#E0DAD2">Planned vs actual spend, every cost feeding the forecast.</text>
</svg>
