      - name: "T4: Cookie consent + storage inventory (qa-consent)"
        id: qa-consent
        run: node tools/qa-consent.cjs

      # M-5 keyboard shortcuts + the shortcut help sheet (audit 2026-10-18):
      # "?" opens the sheet, "/" reaches the assistant, Enter works out the
      # estimate on the calculator, and neither one eats what the user is
