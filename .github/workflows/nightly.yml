name: Nightly Full Suite

on:
  schedule:
    # Run every night at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build JS/CSS bundles
        run: npm run build

      # ── All static checks ─────────────────────────────────────────
      - name: Verify CSP hashes
        run: npm run verify:csp

      - name: Verify service worker
        run: npm run verify:sw

      - name: Verify hidden attributes
        run: npm run verify:hidden

      - name: Verify skills lock
        run: npm run verify:skills

      - name: Verify module exports
        run: node tools/verify-render-exports.cjs

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run

      # ── All Tier 1 scripts ────────────────────────────────────────
      - name: "T1: Dashboard spec"
        run: node tools/qa-dashboard-spec.cjs

      - name: "T1: Changelog diffs"
        run: node tools/qa-changelog-diffs.cjs

      - name: "T1: AI relay"
        run: node tools/qa-ai-relay.cjs

      - name: "T1: Report issue"
        run: node tools/verify-report-issue.cjs

      - name: "T1: Dynamic labels"
        run: node tools/verify-dynamic-labels.cjs

      # ── All Tier 2 scripts (with wrangler dev) ────────────────────
      - name: "Start wrangler dev"
        run: |
          STAGING=/tmp/mmgr-ci-staging
          rm -rf $STAGING && mkdir -p $STAGING
          cp worker.js wrangler.ci.jsonc package.json $STAGING/
          cp -r src/ migrations/ $STAGING/
          cp -r css/ js/ images/ $STAGING/
          cp *.html sw.js manifest.webmanifest favicon.png high-contrast-icon.png primary-icon.png $STAGING/ 2>/dev/null || true
          cd $STAGING
          NODE_PATH=${{ github.workspace }}/node_modules npx wrangler dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          WPID=$!
          cd ${{ github.workspace }}
          echo "Wrangler PID: $WPID"
          sleep 8
          echo "--- Wrangler startup log ---"
          cat /tmp/wrangler.log
          echo "--- End wrangler log ---"
          if ! kill -0 $WPID 2>/dev/null; then
            echo "ERROR: wrangler dev exited prematurely"
            exit 1
          fi
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
              echo "Wrangler dev is ready on 127.0.0.1:8787"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/api/health || { echo "FATAL: wrangler not responding"; cat /tmp/wrangler.log; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "T2: Cloud phase 1"
        run: node tools/qa-cloud-phase1.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Cloud phase 2"
        run: node tools/qa-cloud-phase2.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Cloud codes + delete"
        run: node tools/qa-cloud-codes-delete.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Cloud import"
        run: node tools/qa-cloud-import.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Email auth"
        run: node tools/qa-email-auth.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Reviews"
        run: node tools/qa-reviews.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Rank 9 API"
        run: node tools/qa-rank9-api.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: T9 adoption"
        run: node tools/qa-t9-adoption.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Presence"
        run: node tools/qa-presence.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Prefs roundtrip"
        run: node tools/qa-prefs-roundtrip.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: AI badge E2E"
        run: node tools/qa-ai-badge-e2e.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Market features"
        run: node tools/qa-market-features.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Offline copies"
        run: node tools/qa-offline-copies.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Cloud autosave + signin"
        run: node tools/verify-cloud-autosave-signin.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Controls admin"
        run: node tools/verify-controls-admin.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "Stop wrangler dev"
        if: always()
        run: |
          echo "--- Final wrangler log ---"
          cat /tmp/wrangler.log 2>/dev/null || true
          pkill -f "wrangler" || true
          sleep 2
          pkill -9 -f "wrangler" || true
          rm -rf /tmp/mmgr-ci-staging 2>/dev/null || true

      # ── Nightly summary ────────────────────────────────────────────
      - name: Nightly Summary
        if: always()
        run: |
          echo "## Nightly Full Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Tier 1 and Tier 2 QA scripts executed." >> $GITHUB_STEP_SUMMARY
