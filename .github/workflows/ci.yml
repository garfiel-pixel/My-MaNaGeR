      - name: "T4: App shell - rail gutter + one tab (qa-appshell)"
        id: qa-appshell
        run: node tools/qa-appshell.cjs

      - name: "T4: Finish-target and expiry notices (qa-notice-watchers)"
        id: qa-notice-watchers
        run: node tools/qa-notice-watchers.cjs

      # Wave E (REFINEMENT-DIRECTIVE-2026-10-24): the landing rail goes quiet
      # until hovered, the hero globe turns continuously, and every card stays
      # tethered to its own node.

      - name: "T4: Landing dot rail (qa-dot-rail)"
        id: qa-dot-rail
        run: node tools/qa-dot-rail.cjs

      - name: "T4: Hero globe continuous spin (qa-globe-spin)"
        id: qa-globe-spin
        run: node tools/qa-globe-spin.cjs

      # APP-3 (REFINEMENT-DIRECTIVE-2026-10-24 section 7, Wave F): the three
