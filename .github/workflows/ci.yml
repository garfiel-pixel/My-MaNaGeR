      - name: "T4: Paddle checkout CSP shape (static arm)"
        id: qa-paddle-csp
        env:
          MMGR_QA_NO_BROWSER: 1
        run: node tools/qa-paddle-csp.cjs

      - name: "T4: Auth limits (reset/day, lockout ladder, generic collision)"
        id: qa-auth-limits
        run: node tools/qa-auth-limits.cjs

      - name: "T4: AI + model wiring battery (qa-ai)"
        id: qa-ai
        run: node qa-ai.cjs

      - name: "T4: T-AIWIN - AI window layout and docking (qa-ai-win)"
        id: qa-ai-win
        run: node tools/qa-ai-win.cjs

      # D-2 (UI-CI-DIRECTIVE section 4): the composer mic must append the final
      # transcript once, must never paint the word null, and must keep what the
