        run: node tools/verify-gold.cjs

      # Wave D (REFINEMENT-DIRECTIVE-2026-10-24): the app shell and the
      # calculator controls. qa-appshell measures the closed rail against the
      # page at five widths in both palettes and walks the app to prove one
      # session is one tab. qa-calc-controls proves the owned listbox, the
