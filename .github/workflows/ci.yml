name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --ignore-scripts --no-audit --no-fund

      # Static checks — no live Cloudflare bindings needed.
      # Each step runs independently so one failure doesn't hide the others.
      - run: npm run verify:csp
      - run: npm run verify:sw
      - run: npm run verify:hidden
      - run: npm run verify:skills

      # Deploy validation — catches DO export errors, syntax errors, and
      # missing imports in worker.js without Cloudflare credentials.
      # No staging needed: wrangler filters non-asset files (node_modules,
      # .git) from the upload automatically.
      - run: npx wrangler deploy --dry-run

      # QA scripts confirmed CI-safe (no wrangler dev, no Chrome):
      - run: node tools/qa-dashboard-spec.cjs
      - run: node tools/qa-changelog-diffs.cjs
      - run: node tools/qa-ai-relay.cjs
