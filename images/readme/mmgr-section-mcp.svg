  <text x="64" y="172" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#f5efe6" fill-opacity="0.6">A scoped Model Context Protocol endpoint over the same</text>
  <text x="64" y="196" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#f5efe6" fill-opacity="0.6">project model the app renders. Read first, propose second.</text>
