<svg xmlns="http://www.w3.org/2000/svg" width="900" height="491" viewBox="0 0 900 491" role="img" aria-label="Roadmap of what the built-in AI can do in your project">
  <defs>
    <radialGradient id="board" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#25211D"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </radialGradient>
  </defs>

  <!-- navy board -->
  <rect width="900" height="491" fill="url(#board)"/>

  <!-- faint blueprint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="45" y1="0"  x2="45" y2="491"/><line x1="130" y1="0" x2="130" y2="491"/>
    <line x1="215" y1="0" x2="215" y2="491"/><line x1="300" y1="0" x2="300" y2="491"/>
    <line x1="385" y1="0" x2="385" y2="491"/><line x1="470" y1="0" x2="470" y2="491"/>
    <line x1="555" y1="0" x2="555" y2="491"/><line x1="640" y1="0" x2="640" y2="491"/>
    <line x1="725" y1="0" x2="725" y2="491"/><line x1="810" y1="0" x2="810" y2="491"/>
    <line x1="0" y1="45" x2="900" y2="45"/><line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="215" x2="900" y2="215"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="385" x2="900" y2="385"/><line x1="0" y1="450" x2="900" y2="450"/>
  </g>

  <!-- the road: shadow, gold bed, dashed centerline -->
  <polyline points="60,367 150,337 320,257 490,337 660,257 810,182 855,157"
    fill="none" stroke="#0B0B0D" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"/>
  <polyline points="60,360 150,330 320,250 490,330 660,250 810,175 855,150"
    fill="none" stroke="#E8923A" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="60,360 150,330 320,250 490,330 660,250 810,175 855,150"
    fill="none" stroke="#F5EFE6" stroke-width="3" stroke-dasharray="16 12" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- start marker -->
  <circle cx="60" cy="360" r="10" fill="#FFFFFF" stroke="#D96B27" stroke-width="3"/>
  <text x="60" y="384" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" letter-spacing="2.5" fill="#E0DAD2">START</text>

  <!-- station 1: Ask -->
  <circle cx="150" cy="330" r="27" fill="#FFFFFF" stroke="#D96B27" stroke-width="3"/>
  <text x="150" y="337" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#1C1917">1</text>
  <text x="192" y="322" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Ask</text>
  <text x="192" y="346" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#D8CFC2">Questions about your project</text>

  <!-- station 2: Digest -->
  <circle cx="320" cy="250" r="27" fill="#FFFFFF" stroke="#D96B27" stroke-width="3"/>
  <text x="320" y="257" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#1C1917">2</text>
  <text x="362" y="242" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Digest</text>
  <text x="362" y="266" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#D8CFC2">Weekly digest, status report</text>

  <!-- station 3: Audit -->
  <circle cx="490" cy="330" r="27" fill="#FFFFFF" stroke="#D96B27" stroke-width="3"/>
  <text x="490" y="337" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#1C1917">3</text>
  <text x="532" y="322" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Audit</text>
  <text x="532" y="346" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#D8CFC2">Schedule audit, confidence tags</text>

  <!-- station 4: Your key (optional BYO tier, purple = app AI identity) -->
  <circle cx="660" cy="250" r="27" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/>
  <text x="660" y="257" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#1C1917">4</text>
  <text x="702" y="242" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Your key</text>
  <text x="702" y="266" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#D8CFC2">Gemini, OpenAI, Claude</text>

  <!-- station 5: Fallback (label to the left) -->
  <circle cx="810" cy="175" r="27" fill="#FFFFFF" stroke="#D96B27" stroke-width="3"/>
  <text x="810" y="182" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#1C1917">5</text>
  <text x="768" y="167" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Fallback</text>
  <text x="768" y="191" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#D8CFC2">Auto model ladder</text>

  <!-- finish: checkered flag -->
  <rect x="844" y="84" width="22" height="22" fill="#1C1917"/>
  <g fill="#FFFFFF">
    <rect x="844" y="84" width="11" height="11"/><rect x="866" y="84" width="0" height="0"/>
    <rect x="855" y="95" width="11" height="11"/>
  </g>
  <text x="855" y="125" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" letter-spacing="2.5" fill="#E0DAD2">FINISH</text>

  <!-- caption -->
  <text x="450" y="452" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#E0DAD2">Grounded in your live project data, zero keys to start. Your key anytime.</text>
</svg>