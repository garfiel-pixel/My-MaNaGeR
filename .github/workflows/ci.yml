      # the admin header backup status, and the restore panel that lists BOTH
      # groups (On this device / In your cloud from GET /api/cloud/projects).
      # Static word scan plus real clicks in a fresh browser profile.

      - name: "T4: Three code names + restore recap (qa-code-names)"
        id: qa-code-names
        run: node tools/qa-code-names.cjs

      # S2 remainder of AUDIT-DIRECTIVE-2026-10-18: C6 sticky panel +
