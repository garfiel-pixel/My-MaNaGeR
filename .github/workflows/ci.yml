  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [static, cloud-core, cloud-auth, browser-calc, browser-app]
    if: always()
    steps:
      - name: CI Summary
        run: |
          {
            echo "## CI result"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| static | ${{ needs['static'].result }} |"
            echo "| cloud-core | ${{ needs['cloud-core'].result }} |"
            echo "| cloud-auth | ${{ needs['cloud-auth'].result }} |"
            echo "| browser-calc | ${{ needs['browser-calc'].result }} |"
            echo "| browser-app | ${{ needs['browser-app'].result }} |"
            echo ""
            echo "Each job page lists its own steps."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
