name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Secrets scanning (Backend Security #2) ──────────────────────
      - name: Gitleaks secrets scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # ── Build dist/ assets (needed for verify:sw SHELL checks) ────
      - name: Build JS/CSS bundles
        run: npm run build

      # ── Static integrity checks (no Cloudflare bindings needed) ─────
      - name: Verify CSP inline-script hashes
        id: csp
        run: npm run verify:csp

      # Parse gate: every inline <script> must parse as JS. Catches CSS-in-
      # script mis-pastes (the 2026-09-13 launcher outage, commit b5ae4bb)
      # and any syntax breakage that silently kills a page's logic.
      - name: Verify inline scripts parse (JS syntax gate)
        id: inline
        run: npm run verify:inline

      - name: Verify no CRLF in tracked text files
        id: eol
        # --cached: check the COMMITTED bytes (eol=lf filters normalize at add),
        # immune to working-tree/text-mode differences between OSes. Note: plain
        # grep in Git Bash is blind to \r (MSYS text-mode translation) - git grep
        # reads raw bytes and is the only reliable detector here.
        run: |
          BAD=$(git grep --cached -Il $'\r' -- '*.js' '*.cjs' '*.mjs' '*.md' '*.json' '*.jsonc' '*.sql' '*.yml' '*.css' '*.txt' '*.html' '*.svg' || true)
          if [ -n "$BAD" ]; then
            echo "CRLF line endings found in:"
            echo "$BAD"
            exit 1
          fi

      - name: Verify service-worker cache version
        id: sw
        run: npm run verify:sw

      - name: Verify hidden-attribute wiring
        id: hidden
        run: npm run verify:hidden

      - name: Verify skills-lock integrity
        id: skills
        run: npm run verify:skills

      - name: Verify module export wrappers
        id: exports
        run: node tools/verify-render-exports.cjs

      # Test-registry gate (2026-09-22): every qa-*.cjs / verify-*.cjs /
      # audit-*.cjs in the repo must be registered in docs/CI-TEST-COVERAGE.md
      # with a status token (CI/EXTENDED/TRIAGE/MANUAL). qa-full, qa-ai, qa-v11
      # and qa-p1 sat stale for weeks precisely because nothing tracked which
      # harnesses existed - this makes orphaning a battery a red build.
      - name: Verify test registry (no orphaned harnesses)
        id: registry
        run: node tools/verify-test-registry.cjs

      # CSS integrity (2026-09-22): a CSS comment whose prose contains a
      # comment-END sequence ends the comment early, the rest is parsed as
      # CSS, and the browser then DROPS the rule that follows it. Two such
      # comments in css/mmgr.css had silently killed .t-sm and .btn.full in
      # dist for weeks. ARM 1 catches the stray closer, ARM 2 proves every
      # source rule survives into the minified bundle.
      - name: Verify CSS integrity (comment traps, dropped rules)
        id: css
        run: node tools/verify-css-integrity.cjs

      # ── Deploy validation (dry-run, no credentials needed) ──────────
      - name: Wrangler deploy dry-run
        id: deploy
        run: npx wrangler deploy --dry-run

      # ── TIER 1: Pure-static QA gates (no Chrome, no wrangler dev) ──
      - name: "T1: Dashboard spec (tokens, markup, icons, contrast)"
        id: qa-dashboard
        run: node tools/qa-dashboard-spec.cjs

      - name: "T1: Changelog diff expand"
        id: qa-changelog
        run: node tools/qa-changelog-diffs.cjs

      - name: "T1: AI relay (provider routing, auth, headers)"
        id: qa-ai-relay
        run: node tools/qa-ai-relay.cjs

      - name: "T1: Report-issue payload (PII/budget exclusion)"
        id: qa-report
        run: node tools/verify-report-issue.cjs

      - name: "T1: Dynamic labels accessibility"
        id: qa-labels
        run: node tools/verify-dynamic-labels.cjs

      - name: "T1: Monolith/split delegate gate"
        id: qa-delegate
        run: node tools/verify-delegate-gate.cjs

      - name: "T1: Owner-gate regression (session marker / probe memos)"
        id: qa-owner-gate
        run: node tools/verify-owner-gate.cjs

      # Chrome is needed from here on: the page-health sweep in T2 drives it
      # against wrangler dev, and the T3 batteries drive it directly.
      - name: Chrome available
        id: chrome
        run: google-chrome --version || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)

      # ── TIER 2: Needs wrangler dev (D1/R2 emulation) ────────────────
      - name: "T2: Start wrangler dev (background)"
        id: wrangler-start
        run: |
          rm -rf .wrangler/
          echo 'ADMIN_CODE=QA-ADMIN-CI' > .dev.vars
          npx wrangler d1 migrations apply my-manager-db --local --config wrangler.ci.jsonc --persist-to /tmp/mmgr-wrangler-state
          # Use tee so wrangler output is both logged and captured
          npx wrangler dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 --persist-to /tmp/mmgr-wrangler-state 2>&1 | tee /tmp/wrangler.log &
          WPID=$!
          echo "Wrangler PID: $WPID"
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
              READY=1
              echo "Wrangler dev is ready on 127.0.0.1:8787"
              break
            fi
            echo "Attempt $i: waiting for wrangler..."
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "FATAL: wrangler not responding after 60s"
            echo "--- Wrangler startup log (last 100 lines) ---"
            tail -100 /tmp/wrangler.log
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "T2: Cloud phase 1 (create/save/load/meta)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-phase1.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787

      - name: "T2: Cloud phase 2 (editors, scope, changelog)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-phase2.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787
          ADMIN_CODE: QA-ADMIN-CI

      - name: "T2: Cloud codes + delete"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-codes-delete.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Cloud import"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-import.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      # Page-level health across every served page against the REAL Worker:
      # console errors, uncaught exceptions, failed/4xx responses, CSP
      # violations, live-vs-disk CSP hash drift, emoji, leaked raw values, and
      # a browser-verified check that every source CSS rule is live in the
      # CSSOM. Expected signed-out/localhost noise is classified, so a red run
      # means real breakage.
      - name: "T2: Page health sweep (console/CSP/emoji/CSS coverage)"
        id: health
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-health-sweep.cjs http://127.0.0.1:8787

      # NOTE: email-auth, reviews, rank9, t9, presence, prefs, offline-copies each
      # start their own wrangler with custom vars (GOOGLE_CLIENT_SECRET, etc.)

      # Each self-hosting suite gets a UNIQUE QA_PORT: a leaked wrangler from
      # an earlier step must never answer for a later one (qa-presence used to
      # leak onto :8796 and break qa-offline-copies — 2026-09-13).
      - name: "T2: Email auth"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-email-auth.cjs
        env:
          MMGR_QA_NO_BROWSER: 1
          QA_PORT: 8801

      - name: "T2: Reviews"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-reviews.cjs
        env:
          QA_PORT: 8802

      - name: "T2: Rank 9 API"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-rank9-api.cjs
        env:
          QA_PORT: 8803

      - name: "T2: T9 adoption"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-t9-adoption.cjs
        env:
          QA_PORT: 8804

      - name: "T2: Presence"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-presence.cjs
        env:
          QA_PORT: 8805

      - name: "T2: Prefs roundtrip"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-prefs-roundtrip.cjs
        env:
          MMGR_QA_NO_BROWSER: 1
          QA_PORT: 8806

      - name: "T2: AI badge E2E"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-ai-badge-e2e.cjs
        env:
          MMGR_QA_NO_BROWSER: 1
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Market features"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-market-features.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787

      - name: "T2: Offline copies"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-offline-copies.cjs
        env:
          QA_PORT: 8807

      - name: "T2: Cloud autosave + signin"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/verify-cloud-autosave-signin.cjs
        env:
          QA_PORT: 8800

      - name: "T2: Wrangler restart for controls admin"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: |
          echo "Restarting wrangler with fresh state for controls admin..."
          pkill -f "wrangler" 2>/dev/null || true
          sleep 3
          rm -rf /tmp/mmgr-wrangler-state 2>/dev/null
          npx wrangler d1 migrations apply my-manager-db --local --config wrangler.ci.jsonc --persist-to /tmp/mmgr-wrangler-state
          npx wrangler dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 --persist-to /tmp/mmgr-wrangler-state >> /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
              echo "Wrangler ready on :8787"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1 || { echo "FATAL: wrangler restart failed"; exit 1; }
          sleep 5
          curl -sf http://127.0.0.1:8787/dist/bundle.js > /dev/null 2>&1 || { echo "FATAL: static assets not ready"; exit 1; }
          echo "Wrangler fully ready (health + assets OK)"

      - name: "T2: Controls admin"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/verify-controls-admin.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787

      - name: "Stop wrangler dev"
        if: always()
        run: |
          echo "--- Final wrangler log ---"
          cat /tmp/wrangler.log 2>/dev/null || true
          pkill -f "wrangler" || true
          sleep 2
          pkill -9 -f "wrangler" || true
          rm -rf /tmp/mmgr-ci-staging 2>/dev/null || true

      # ── TIER 3: Headless-Chrome E2E (these suites spawn their OWN wrangler,
      # so they run AFTER the shared :8787 wrangler is stopped) ───────────
      - name: "T3: Client codes E2E (launcher code-entry -> project client scope)"
        id: qa-client-codes
        run: node tools/qa-client-codes.cjs
        env:
          CHROME_DEBUG_PORT: 9231
          QA_PORT: 8808

      - name: "T2: Project API keys E2E (scoped X-API-Key read + review-queue writes)"
        id: qa-api-keys
        run: node tools/qa-api-keys.cjs
        env:
          QA_PORT: 8809

      - name: "T2: Sync bond E2E (file trip keeps the cloud twin link + re-sync merge)"
        id: qa-sync-bond
        run: node tools/qa-sync-bond.cjs
        env:
          QA_PORT: 8810

      # ── TIER 4: static-server browser batteries ─────────────────────
      # These root-level suites drive headless Chrome against serve.cjs on
      # :8765 (no wrangler). They existed for months WITHOUT being wired into
      # CI, which is exactly how they drifted out of date while every gate
      # stayed green. Every one of them is green as of 2026-09-22.
      - name: "T4: Start static QA server (serve.cjs)"
        id: serve-static
        run: |
          node serve.cjs > /tmp/serve-static.log 2>&1 &
          READY=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/app.html > /dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ $READY -eq 0 ]; then
            echo "FATAL: serve.cjs did not answer on :8765"
            tail -50 /tmp/serve-static.log
            exit 1
          fi
          echo "serve.cjs ready on 127.0.0.1:8765"

      - name: "T4: Full gap-list battery (qa-full)"
        id: qa-full
        run: node qa-full.cjs

      - name: "T4: AI + model wiring battery (qa-ai)"
        id: qa-ai
        run: node qa-ai.cjs

      - name: "T4: v11 feature battery (qa-v11)"
        id: qa-v11
        run: node qa-v11.cjs

      - name: "T4: P1 core battery (qa-p1)"
        id: qa-p1
        run: node qa-p1.cjs

      - name: "T4: Theme persistence + system follow (verify-theme-cdp)"
        id: qa-theme
        run: node tools/verify-theme-cdp.cjs

      - name: "T4: Stop static QA server"
        if: always()
        run: pkill -f "node serve.cjs" || true

      # ── CI Summary ──────────────────────────────────────────────────
      - name: CI Summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks scan | ${{ steps.gitleaks.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CSP hashes | ${{ steps.csp.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Inline JS parse | ${{ steps.inline.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Line endings | ${{ steps.eol.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Client codes E2E | ${{ steps.qa-client-codes.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API keys E2E | ${{ steps.qa-api-keys.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sync bond E2E | ${{ steps.qa-sync-bond.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service Worker | ${{ steps.sw.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hidden attributes | ${{ steps.hidden.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skills lock | ${{ steps.skills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module exports | ${{ steps.exports.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS integrity | ${{ steps.css.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test registry | ${{ steps.registry.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Page health sweep | ${{ steps.health.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wrangler dry-run | ${{ steps.deploy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard spec | ${{ steps.qa-dashboard.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Changelog diffs | ${{ steps.qa-changelog.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI relay | ${{ steps.qa-ai-relay.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Report issue | ${{ steps.qa-report.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dynamic labels | ${{ steps.qa-labels.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Delegate gate | ${{ steps.qa-delegate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS integrity | ${{ steps.css.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Page health sweep | ${{ steps.wrangler-start.outcome == 'success' && 'ran in T2' || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| qa-full battery | ${{ steps.qa-full.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| qa-ai battery | ${{ steps.qa-ai.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| qa-v11 battery | ${{ steps.qa-v11.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| qa-p1 battery | ${{ steps.qa-p1.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Theme persistence | ${{ steps.qa-theme.outcome }} |" >> $GITHUB_STEP_SUMMARY
