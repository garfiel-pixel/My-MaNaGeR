name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# D-4 (UI-CI-DIRECTIVE section 6): five parallel jobs. One job used to run
# every step in order: a 25 minute wall clock, and one red step hid every
# later step (AGENTS.md section 8 item 1). Each job now carries only the
# setup it needs, and a final summary job reads needs.<job>.result.
# tools/verify-ci-coverage.cjs proves no step was dropped or duplicated
# outside the per-job setup lines.

# SEC-01: least-privilege token. Every job inherits this; jobs that need more
# (e.g. CodeQL) declare it locally. No workflow here deploys for real, so read
# is enough for the whole file.
permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build JS/CSS bundles
        run: npm run build
      - name: npm audit (high+ only; fails CI on high/critical)  # SEC-07
        id: audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify workflow security (SEC-01 gate)  # 4.1
        id: wfsec
        run: node tools/verify-workflow-security.cjs

      - name: Verify vendored code provenance (SEC-07 gate)  # 4.1
        id: vendor
        run: node tools/verify-vendor.cjs

      - name: Gitleaks secrets scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        # gitleaks auto-detects .gitleaks.toml at the repo root; this action
        # version accepts no `with:` inputs, so passing one is a hard error
        # ("Unexpected input(s) 'config'"). The repo config allowlists ONLY the
        # Paddle client-side token in pricing.html (public by design; it can
        # only open a checkout). It does NOT allowlist pdl_live_apikey_ keys,
        # which stay server-only Wrangler secrets.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CSP inline-script hashes
        id: csp
        run: npm run verify:csp

      # Parse gate: every inline <script> must parse as JS. Catches CSS-in-
      # script mis-pastes (the 2026-09-13 launcher outage, commit b5ae4bb)
      # and any syntax breakage that silently kills a page's logic.

      - name: Verify inline scripts parse (JS syntax gate)
        id: inline
        run: npm run verify:inline

      # Source-script parse gate (added 2026-10-02). `node build.js` only
      # parses what it BUNDLES, so a standalone script - js/calculator-page.js
      # is loaded straight by calculator.html - can carry a hard SyntaxError
      # and kill its whole page with every other gate still green. That is
      # exactly how the calculator died on unquoted hyphenated object keys.

      - name: Verify every source script parses (standalone scripts included)
        id: jssyntax
        run: npm run verify:js

      - name: Verify no CRLF in tracked text files
        id: eol
        # ONE definition, shared with `npm run verify` and the pre-commit hook.
        # It reads the INDEX (--cached), so it checks the committed bytes that
        # eol=lf filters produce at add, immune to working-tree/text-mode
        # differences between OSes. Plain grep in Git Bash is blind to \r
        # (MSYS text-mode translation); git grep reads raw bytes and is the
        # only reliable detector, so the tool uses it too. Before 2026-10-28
        # this logic existed ONLY here, which is how ebc0720 passed every local
        # gate and went red at step 10 (two stray CRs in a plan doc).
        run: npm run verify:eol

      - name: Verify service-worker cache version
        id: sw
        run: npm run verify:sw

      - name: Verify hidden-attribute wiring
        id: hidden
        run: npm run verify:hidden

      - name: Verify skills-lock integrity
        id: skills
        run: npm run verify:skills

      - name: Verify module export wrappers
        id: exports
        run: node tools/verify-render-exports.cjs

      # Test-registry gate (2026-09-22): every qa-*.cjs / verify-*.cjs /
      # audit-*.cjs in the repo must be registered in docs/CI-TEST-COVERAGE.md
      # with a status token (CI/EXTENDED/TRIAGE/MANUAL). qa-full, qa-ai, qa-v11
      # and qa-p1 sat stale for weeks precisely because nothing tracked which
      # harnesses existed - this makes orphaning a battery a red build.

      - name: Verify test registry (no orphaned harnesses)
        id: registry
        run: node tools/verify-test-registry.cjs

      # CSS integrity (2026-09-22): a CSS comment whose prose contains a
      # comment-END sequence ends the comment early, the rest is parsed as
      # CSS, and the browser then DROPS the rule that follows it. Two such
      # comments in css/mmgr.css had silently killed .t-sm and .btn.full in
      # dist for weeks. ARM 1 catches the stray closer, ARM 2 proves every
      # source rule survives into the minified bundle.

      - name: Verify CSS integrity (comment traps, dropped rules)
        id: css
        run: node tools/verify-css-integrity.cjs

      - name: Verify accessibility labels (Waves 8.5 + 8.6)
        id: a11y
        run: node tools/verify-a11y-labels.cjs

      # Unit layer (node:test, Wave 8.11 billing helpers). The 10 tests and the
      # `npm test` script existed but NOTHING ran them: the composite
      # `npm run verify` chain never included it and CI calls its steps
      # individually, so a regression in tier derivation or the free-project cap
      # could ship green. This step is the one that actually executes them.

      - name: Unit tests (node:test billing helpers)
        id: unit
        run: npm test

      - name: Verify ESLint (Wave 8.7)
        id: eslint
        run: node tools/verify-eslint.cjs

      - name: Verify Prettier (Wave 8.7)
        id: prettier
        run: node tools/verify-prettier.cjs

      # E5 (REPO-RELIABILITY-DIRECTIVE 2026-10-30): a ceiling per file, so the
      # 484 KB stylesheet and the 562 KB calculator script cannot grow back
      # unnoticed. Caps are measured sizes plus headroom; raising one is
      # allowed only in the commit that needs it.
      - name: Verify file sizes (no monolith grows back)
        id: sizes
        run: npm run verify:sizes

      # Observability cost + privacy (S-3, audit 2026-10-18). Two halves:
      # the wrangler config must not record every request (traces <= 10%,
      # invocation logs off, query string redacted, errors unsampled) and
      # the log scrubber in src/lib/observe.js must keep every credential
      # OUT of the log tail while leaving the useful context in.

      - name: "T1: Observability sampling + redaction (S-3)"
        id: qa-observe
        run: node tools/verify-observability-redaction.cjs

      # CSP scoping (S-4, audit 2026-10-18). 'unsafe-eval' turns a string
      # into code, so it must reach the vendored whisper runtime ONLY.
      # The gate reads the policies in worker.js and serve.cjs, proves the
      # Worker and the dev server declare the same ones, and then FETCHES
      # every HTML page and reads the header it comes back with - with a
      # control that proves the whisper runtime really does get the
      # relaxed policy, so the check cannot pass by being vacuous.

      - name: "T1: CSP scoping - no unsafe-eval on any HTML page (S-4)"
        id: qa-csp-eval
        run: node tools/verify-csp-unsafe-eval.cjs

      # Google sign-in wiring + domain gate (owner 2026-10-31). One client ID
      # everywhere, the CSP origins GIS needs, a mount and a module on every
      # page that loads GIS, the Authorized JavaScript Origins checklist in
      # docs/GOOGLE-SIGNIN-SETUP.md tracking every canonical domain, and a
      # tripwire on the tokeninfo wire shape that broke sign-in for a week.
      - name: "T1: Google sign-in wiring + domain checklist"
        id: google-signin
        run: npm run verify:google

      # ── Deploy validation (dry-run, no credentials needed) ──────────

      # D-4 (UI-CI-DIRECTIVE section D4.3): the split moved 112 run: blocks
      # into five jobs. verify-test-registry proves every harness is
      # REGISTERED; this proves every one is still EXECUTED, that the run:
      # multiset is unchanged outside the per-job setup lines, and that no
      # if: reads steps.<id>.outcome from another job.
      - name: Verify CI coverage (no step dropped by the split)
        id: ci-coverage
        run: node tools/verify-ci-coverage.cjs

      - name: Wrangler deploy dry-run
        id: deploy
        run: npx wrangler deploy --dry-run

      # ── TIER 1: Pure-static QA gates (no Chrome, no wrangler dev) ──

      - name: "T1: Dashboard spec (tokens, markup, icons, contrast)"
        id: qa-dashboard
        run: node tools/qa-dashboard-spec.cjs

      - name: "T1: Changelog diff expand"
        id: qa-changelog
        run: node tools/qa-changelog-diffs.cjs

      - name: "T1: AI relay (provider routing, auth, headers)"
        id: qa-ai-relay
        run: node tools/qa-ai-relay.cjs

      - name: "T1: Rate-limit keying (SEC-03: rotating codes, per-IP bucket, fail ladder)"
        id: qa-ratelimit-keying
        run: node tools/qa-ratelimit-keying.cjs

      - name: "T1: CSP connect-src candidate (SEC-06: report-only, no bare scheme, sink)"
        id: verify-csp-connect
        run: node tools/verify-csp-connect.cjs

      - name: "T1: Security headers over seven surfaces (nosniff, HSTS, CSP, COOP/CORP)"
        id: qa-security-headers
        run: node tools/qa-security-headers.cjs

      - name: "T1: Report-issue payload (PII/budget exclusion)"
        id: qa-report
        run: node tools/verify-report-issue.cjs

      - name: "T1: Dynamic labels accessibility"
        id: qa-labels
        run: node tools/verify-dynamic-labels.cjs

      - name: "T1: Monolith/split delegate gate"
        id: qa-delegate
        run: node tools/verify-delegate-gate.cjs

      - name: "T1: Owner-gate regression (session marker / probe memos)"
        id: qa-owner-gate
        run: node tools/verify-owner-gate.cjs

      - name: "T1: First-project CTA + admin credential kinds (5.4 A1+A2)"
        id: qa-admin-credentials
        run: node tools/qa-admin-credentials.cjs

      # T-1/T-2/T-3 gates from AUDIT-DIRECTIVE-2026-10-18 (bug classes
      # F1/F2/F3, each invisible to every gate that existed before: an
      # unresolved sprite <use href> renders an empty box with no error,
      # an unanswered data-action does nothing, a dead page.html#anchor
      # lands at the top of the page). Pure-static, no Chrome needed.
      # Each was proven to bite by injecting its bug class (6/6 teeth).

      - name: "T1: Icon sprite contract (F1 - every use href resolves)"
        id: qa-icons
        run: node tools/verify-icons.cjs

      - name: "T1: data-action contract (F2 - every action answered)"
        id: qa-actions
        run: node tools/verify-actions.cjs

      - name: "T1: Internal links (F3 - every href exists, anchor resolves)"
        id: qa-links
        run: node tools/verify-links.cjs

      # APP-2 / PERF-1 static halves (REFINEMENT-DIRECTIVE-2026-10-24).
      # The new-tab allow-list is a CONTRACT (a stale entry fails too), and
      # every page that can start a GPU decoration must boot Performance Mode
      # BEFORE the shader mounts.

      - name: "T1: Same-tab navigation (T-NEWTAB static)"
        id: verify-newtab
        run: node tools/verify-newtab.cjs

      - name: "T1: Performance Mode boot + kill block (T-PERF-WIRE static)"
        id: verify-perf-boot
        run: node tools/verify-perf-boot.cjs

      # Rate book rebrand (REFINEMENT-DIRECTIVE-2026-10-24 3.2/3.3): one name,
      # one notice, the pricing count equal to the rows in the data, and no
      # claim of independent production while the provenance is unresolved.

      - name: "T1: Rate book name, notice and count"
        id: verify-ratebook
        run: node tools/verify-ratebook-wording.cjs

      # G-1 (FIELD-FINDINGS-DIRECTIVE-2026-10-28): the rate-unit gate. A
      # per-square-metre book rate must never price a square-foot quantity
      # (the 10.76x money bug). Pure-Node: reuses js/rateunits.js + the shipped
      # rate book. Proves the owner's 100 ft x 100 ft / Masonry #6 fixture
      # (imperial 1,420,000, metric within 0.1%), every row reconciled in both
      # unit systems within 1.5% (genuine first-party outliers documented in
      # docs/RATE-UNIT-OUTLIERS.md), and the custom-line refusal that names both
      # units. No Chrome, no wrangler - the static job carries it.

      - name: "T1: Rate-unit reconciliation (G-1 money bug)"
        id: qa-rate-unit
        run: node tools/qa-rate-unit.cjs

      # MAT-1 (REFINEMENT-DIRECTIVE-2026-10-24): the static half of the itemised
      # material table - every WORK trade carries an itemised list or a written
      # reason, every line is fully shaped, and no trade whose material
      # description names more than one component is left as a bare lump.
      # The browser half (T-ACC) is the qa-mat-items step in T4.

      - name: "T1: Itemised materials table (T-LUMP static)"
        id: verify-calc-lump
        run: node tools/verify-calc-lump.cjs

      # SW-14 (REFINEMENT-DIRECTIVE-2026-10-24 section 11): the sweep's
      # "unreachable settings" detector, made permanent. It fails if any
      # stored setting has no field and no AI path, if the assistant's
      # prompt and the page's allowlist disagree, and - the guard the sweep
      # itself lacked - if an extraction comes back empty instead of
      # silently reporting the code as clean.

      - name: "T1: Settings reachability (SW-14 permanent test)"
        id: verify-settings-reach
        run: node tools/verify-settings-reach.cjs

      # SW-13 (REFINEMENT-DIRECTIVE-2026-10-24 section 11): the sweep's
      # "notice containers that no code ever fills" detector made permanent.
      # Its first version asked the wrong question and reported 14 false
      # positives, and the sweep only read js/*.js, so renderer-built ids in
      # js/render/ were invisible. This gate asserts the sweep now reports
      # zero, that the containers it judges still exist (a regex that matches
      # nothing also reports zero), and that the producers it relies on are in
      # files it actually scans.

      - name: "T1: Notice containers (SW-13 permanent test)"
        id: verify-sweep13
        run: node tools/verify-sweep13.cjs

      # SW-10 (REFINEMENT-DIRECTIVE-2026-10-24 section 11, Wave F): the
      # sweep's "clickable div/span with no role, tabindex or key handler"
      # detector made permanent. Baseline was 16 hits across admin.html,
      # app.html and project.html. This gate asserts the sweep now reports
      # zero, that the surfaces it judges still exist (a regex that matches
      # nothing also reports zero), that the two real controls carry
      # role=button + tabindex=0 with a delegated keydown that turns Enter
      # and Space into a click, and that no aria-hidden scrim became
      # focusable along the way.

      - name: "T1: Clickable div/span a11y (SW-10 permanent test)"
        id: verify-sw10
        run: node tools/verify-sw10.cjs

      # GANTT-1 (REFINEMENT-DIRECTIVE-2026-10-24 section 8): ONE view builder
      # feeds the live chart and the PNG / SVG / PDF exports. Runs the pure
      # module in a vm sandbox against the committed bank fixture, proves the
      # link policies (all / near / critical / gates), the tidy reduction, the
      # swimlane axes and the automatic scale, then proves STATICALLY that all
      # four painters read that one builder.

      - name: "T1: Gantt view builder (T-GANTT)"
        id: verify-gantt-view
        run: node tools/verify-gantt-view.cjs

      # G-2 gate (DIRECTIVE: GOOGLE SIGN-IN SECURITY GAPS, 2026-10-23):
      # in-process Worker route battery + the 14 sign-in nonce checks
      # (wrong/reused/expired/forged, email_verified, flag on/off, sweep).

      - name: "T1: Auth worker routes + sign-in nonce contract"
        id: verify-auth-worker
        run: node tools/verify-auth-worker.mjs

      # I-6/I-7/I-8 landing-page gates (BUDGET-BOQ-MCP 2026-11-05). Pure-static
      # (no Chrome): copy/CTA discipline, photography provenance + size, and the
      # bento rotator flip contract. Each is registered in docs/CI-TEST-COVERAGE.md.
      - name: "T1: Landing copy + CTA gate (T-COPY)"
        id: qa-copy
        run: node tools/qa-copy-gate.cjs

      - name: "T1: Landing photography provenance + size (T-PHOTOS)"
        id: qa-photos
        run: node tools/qa-photos-gate.cjs

      - name: "T1: Landing bento rotator flip contract (T-BENTO)"
        id: qa-bento
        run: node tools/qa-bento-gate.cjs


      # Chrome is needed from here on: the page-health sweep in T2 drives it
      # against wrangler dev, and the T3 batteries drive it directly.

      - name: Chrome available
        id: chrome
        run: google-chrome --version || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)

      # AUDIT-DIRECTIVE-2026-10-18 tripwires that need a real browser.

      - name: "T1: Measured-quantity unit boundary (golden table)"
        id: qa-units
        run: node tools/verify-units.cjs

      - name: T2 export reconciliation (CSV schema + real xlsx)
        run: node tools/verify-export.cjs

      - name: "T3: Currency honesty (never charge a model rate as local money)"
        id: qa-currency
        run: node tools/verify-currency.cjs

      - name: "T4: Print allow-list matches the real DOM"
        id: qa-print-dom
        run: node tools/verify-print-dom.cjs

      - name: "T5: No Math.random under src/ or worker.js"
        id: qa-weak-random
        run: node tools/verify-no-weak-random.cjs

      - name: "T8: Plan docs stay under 40 KB"
        id: qa-doc-size
        run: node tools/verify-doc-size.cjs

      # ── TIER 2: Needs wrangler dev (D1/R2 emulation) ────────────────

      - name: Job summary (static)
        if: always()
        run: |
          echo "### static: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  cloud-core:
    name: cloud-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build JS/CSS bundles
        run: npm run build

      - name: "T2: Start wrangler dev (background)"
        id: wrangler-start
        run: |
          rm -rf .wrangler/
          echo 'ADMIN_CODE=QA-ADMIN-CI' > .dev.vars
          npx wrangler d1 migrations apply my-manager-db --local --config wrangler.ci.jsonc --persist-to /tmp/mmgr-wrangler-state
          # Use tee so wrangler output is both logged and captured
          npx wrangler dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 --persist-to /tmp/mmgr-wrangler-state 2>&1 | tee /tmp/wrangler.log &
          WPID=$!
          echo "Wrangler PID: $WPID"
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
              READY=1
              echo "Wrangler dev is ready on 127.0.0.1:8787"
              break
            fi
            echo "Attempt $i: waiting for wrangler..."
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "FATAL: wrangler not responding after 60s"
            echo "--- Wrangler startup log (last 100 lines) ---"
            tail -100 /tmp/wrangler.log
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "T2: Cloud phase 1 (create/save/load/meta)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-phase1.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787

      - name: "T2: Cloud phase 2 (editors, scope, changelog)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-phase2.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787
          ADMIN_CODE: QA-ADMIN-CI

      - name: "T2: Cloud photos (R2 blobs + D1 metadata)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-photos.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787
          QA_BASE: http://127.0.0.1:8787

      - name: "T2: Cloud codes + delete"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-codes-delete.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      - name: "T2: Project MCP write path (empty/1/30/200 diffs, cap, scope, P1/P2 semantics)"
        id: qa-mcp-write-path
        run: node tools/qa-mcp-write-path.cjs

      # The cancel contract against the REAL Worker. With no session cookie this
      # exercises the session gate (a bare DELETE must be refused with the
      # generic 403 body before any subscription row is read) and marks the
      # cookie-dependent gates N/A; with QA_BILLING_CANCEL_COOKIE set it also
      # runs the typed-confirmation and error-message gates. Registered as CI in
      # docs/CI-TEST-COVERAGE.md, which is only true while this step exists.

      - name: "T2: Billing cancel contract"
        id: qa-billing-cancel
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-billing-cancel.cjs
        env:
          QA_BILLING_CANCEL_URL: http://127.0.0.1:8787/

      - name: "T2: Cloud import"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-cloud-import.cjs
        env:
          WRANGLER_DEV_URL: http://127.0.0.1:8787

      # Page-level health across every served page against the REAL Worker:
      # console errors, uncaught exceptions, failed/4xx responses, CSP
      # violations, live-vs-disk CSP hash drift, emoji, leaked raw values, and
      # a browser-verified check that every source CSS rule is live in the
      # CSSOM. Expected signed-out/localhost noise is classified, so a red run
      # means real breakage.

      - name: "T2: Page health sweep (console/CSP/emoji/CSS coverage)"
        id: health
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-health-sweep.cjs http://127.0.0.1:8787

      # NOTE: email-auth, reviews, rank9, t9, presence, prefs, offline-copies each
      # start their own wrangler with custom vars (GOOGLE_CLIENT_SECRET, etc.)

      # Each self-hosting suite gets a UNIQUE QA_PORT: a leaked wrangler from
      # an earlier step must never answer for a later one (qa-presence used to
      # leak onto :8796 and break qa-offline-copies — 2026-09-13).

      - name: "T2: Team RBAC (named members, tier caps)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-team-rbac.cjs
        env:
          QA_PORT: 8812

      # I-1 (BUDGET-BOQ-MCP 2026-11-05): the cross-device cloud-project list
      # contract. Self-hosts its own wrangler on :8820 (it forges Google-shaped
      # sessions, so it needs no shared :8787 state and runs regardless of the
      # shared dev server). A pass proves the server keys the list on the signed
      # account; the owner's "projects disappear after re-sign-in" report is then
      # a client-side upload/boot defect.
      - name: "T2: Cloud project list cross-device (T-CLOUDLIST)"
        id: qa-cloudlist
        if: success()
        run: node tools/qa-cloudlist.cjs

      # 5.2 orphaned-subscription cleanup. Self-hosting like Team RBAC: its own
      # wrangler on QA_PORT with PADDLE_API_BASE pointed at a loopback stub, so
      # the cancel-failure path (provider refuses -> row stays) runs against the
      # real Worker code. Registered in docs/CI-TEST-COVERAGE.md, which is only
      # true while this step exists.

      - name: "T2: Billing orphan cleanup (stubbed Paddle)"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-billing-orphan.cjs
        env:
          QA_PORT: 8816

      # The browser half of RBAC sprint 2. It spawns its own wrangler + D1/R2
      # (like every T3 suite) and drives the real Chrome over the invitation
      # bell, the accept landing page, the member scope, a queued supervisor
      # save, a read-only client, and a live revoke. Ports are unique.

      - name: "T2: AI badge E2E"
        if: success() && steps.wrangler-start.outcome == 'success'
        run: node tools/qa-ai-badge-e2e.cjs
        env:
          MMGR_QA_NO_BROWSER: 1
